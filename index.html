<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Astronomical Clock</title><link rel="stylesheet" href="css/clock.css"></head>
<body><main id="app" class="app">
<header class="header"><div class="title"><h1>Astronomical Clock</h1><div id="place" class="sub">Loading…</div><div id="coords" class="coords"></div></div><div><div id="dateTitle"></div><div id="zone" class="sub"></div></div></header>
<section class="controls" aria-label="Date controls">
<button data-days="-30">−30</button><button data-days="-7">−7</button><button data-days="-1">−1</button>
<input id="datePicker" type="date" aria-label="Observing date"><button id="today">Today</button>
<button data-days="1">+1</button><button data-days="7">+7</button><button data-days="30">+30</button>
<label class="sub" for="jump">Days</label><input id="jump" type="number" value="14" min="-3650" max="3650"><button id="jumpBtn">Go</button>
</section>
<section class="location-controls" aria-label="Location controls">
<label for="locationSelect">Location</label>
<select id="locationSelect">
<option value="longmont">Longmont, Colorado</option>
<option value="rmnp">Rocky Mountain National Park</option>
<option value="custom">Custom location…</option>
</select>
<button id="useLocation" type="button">Use my location</button>
<div id="customLocation" class="custom-location hidden">
<input id="locationName" type="text" placeholder="Location name" aria-label="Location name">
<input id="latitude" type="number" step="any" min="-90" max="90" placeholder="Latitude" aria-label="Latitude">
<input id="longitude" type="number" step="any" min="-180" max="180" placeholder="Longitude" aria-label="Longitude">
<input id="elevation" type="number" step="1" placeholder="Elevation m" aria-label="Elevation in metres">
<input id="timezone" type="text" placeholder="America/Denver" aria-label="IANA time zone">
<button id="applyLocation" type="button">Apply</button>
</div>
<div id="locationStatus" class="sub"></div>
</section>
<div class="layout"><section class="clock-wrap"><svg id="clock" class="clock" viewBox="0 0 700 700" role="img" aria-label="Noon-to-noon astronomical clock"></svg></section>
<aside><div class="panel"><h2>Solar events</h2><div id="events" class="solar-events"></div>
<div class="object-card"><h2>Objects</h2>
<div class="track-toggles" aria-label="Clock track visibility">
<label><input id="showMoon" type="checkbox" checked> Moon</label>
<label><input id="showPlanets" type="checkbox"> Planets</label>
<label><input id="showDeepSky" type="checkbox"> Deep sky</label>
</div>
<div id="objectList" class="object-list"></div></div>
<div class="moon-card"><h2>Moon</h2><div class="moon-summary"><div id="moonSymbol" class="moon-symbol">◐</div><div><div id="moonPhase" class="moon-phase"></div><div id="moonIllum" class="sub"></div></div></div><div class="moon-events"><div>Rise</div><div id="moonRise">—</div><div>Highest</div><div id="moonHighest">—</div><div>Set</div><div id="moonSet">—</div></div><div id="moonObserving" class="moon-observing"></div></div>
<div class="note">Clock runs from local noon to local noon. Twilight: civil −6°, nautical −12°, astronomical −18°. Golden hour: −4° to +6°. Blue hour overlay: −8° to −4°.</div></div></aside></div>
<div id="error" class="error"></div></main><script type="module" src="js/app.js"></script></body></html>
